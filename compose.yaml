# 默认 PostgreSQL、TLS Redis 和外部 R2；New API 必须独立部署。
name: multimodal-canvas-app

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: '3000'
  API_TRUST_PROXY_HOPS: '1'
  RUN_SERVICE: bullmq
  RUN_QUEUE_NAME: ${RUN_QUEUE_NAME:-canvas-accounts-v1}
  WORKER_PROVIDER: newapi
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
  S3_ENDPOINT: ${S3_ENDPOINT:?必须配置 Cloudflare R2 S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET:?必须配置已有 R2 S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?必须配置 R2 S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?必须配置 R2 S3_SECRET_KEY}
  S3_REGION: auto
  S3_UPLOAD_MODE: proxy
  S3_DOWNLOAD_MODE: proxy
  S3_PROVIDER_ENDPOINT: ${S3_PROVIDER_ENDPOINT:-}
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  FFMPEG_ENABLED: 'true'
  FFPROBE_ENABLED: 'true'
  NODE_EXTRA_CA_CERTS: /run/multimodal/secrets/ca.crt
  NEW_API_ISSUER: ${NEW_API_ISSUER:?必须配置独立 New API 的 NEW_API_ISSUER}
  NEW_API_CLIENT_ID: ${NEW_API_CLIENT_ID:-canvas}
  NEW_API_INSTANCE_ID: ${NEW_API_INSTANCE_ID:-main}
  NEW_API_CLIENT_SECRET: ${NEW_API_CLIENT_SECRET:-}
  NEW_API_REDIRECT_URI: ${NEW_API_REDIRECT_URI:-${CANVAS_WEB_URL:-http://localhost:${MC_HTTP_PORT:-8080}}/v1/auth/newapi/callback}
  CANVAS_WEB_URL: ${CANVAS_WEB_URL:-http://localhost:${MC_HTTP_PORT:-8080}}
  # 同源网关不需要 CORS；跨源客户端必须显式提供 HTTPS origin。
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  NEW_API_ADMIN_USER_IDS: ${NEW_API_ADMIN_USER_IDS:-}
  NEW_API_VIDEO_CONTRACT: ${NEW_API_VIDEO_CONTRACT:-newapi-video-v1}
  API_RATE_LIMIT_REDIS_ENABLED: 'true'
  API_RATE_LIMIT_PER_MINUTE: '600'

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
  volumes:
    - app_secrets:/run/multimodal:ro
  environment: *runtime-environment
  stop_grace_period: 90s
  logging: *bounded-logging

services:
  initialize:
    image: multimodal-canvas-initialize:local
    build:
      context: .
      target: initialize
    volumes:
      - secrets:/run/multimodal
      - app_secrets:/run/multimodal-views/app
      - postgres_secrets:/run/multimodal-views/postgres
      - redis_secrets:/run/multimodal-views/redis
    restart: 'no'
    logging: *bounded-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD_FILE: /run/multimodal/secrets/postgres-password
    volumes:
      - postgres:/var/lib/postgresql/data
      - postgres_secrets:/run/multimodal:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvas -d canvas']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '/run/multimodal/secrets/redis.conf']
    volumes:
      - redis:/data
      - redis_secrets:/run/multimodal:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/multimodal/secrets/redis-password)" redis-cli --tls --cacert /run/multimodal/secrets/ca.crt -h redis ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging

  migrate:
    <<: *runtime
    image: multimodal-canvas-migrate:local
    build:
      context: .
      target: migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    image: multimodal-canvas-api:local
    build:
      context: .
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'docker/run.mjs', 'health', 'api']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  worker:
    <<: *runtime
    image: multimodal-canvas-worker:local
    build:
      context: .
      target: worker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'docker/run.mjs', 'health', 'worker']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

  web:
    image: multimodal-canvas-web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m
      - /config:rw,noexec,nosuid,size=16m
    ports:
      - '127.0.0.1:${MC_HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded-logging

  # 公网部署可启用 server profile；域名与 CANVAS_WEB_URL 必须一致。
  gateway:
    image: caddy:2.10.2-alpine
    profiles: ['server']
    restart: unless-stopped
    environment:
      MC_DOMAIN: ${MC_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/logging.caddy:/etc/caddy/logging.caddy:ro
      - gateway_data:/data
      - gateway_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 18
    logging: *bounded-logging

volumes:
  secrets:
  app_secrets:
  postgres_secrets:
  redis_secrets:
  postgres:
  redis:
  gateway_data:
  gateway_config:
