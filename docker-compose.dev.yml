services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multimodal_canvas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - multimodal_canvas_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - multimodal_canvas_minio:/data

volumes:
  multimodal_canvas_postgres:
  multimodal_canvas_minio:
