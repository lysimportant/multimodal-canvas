# 源码开发的数据库与队列；对象存储只使用外部 R2，New API 另行部署。
name: multimodal-canvas-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?开发库必须配置 POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - multimodal_canvas_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?开发队列必须配置 REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - multimodal_canvas_redis:/data
volumes:
  multimodal_canvas_postgres:
  multimodal_canvas_redis:
