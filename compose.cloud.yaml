# S3 兼容外部对象存储（如 Cloudflare R2）叠加配置；数据库与 Redis 仍使用本栈容器。
# 用法：docker compose --env-file .env.compose -f compose.yaml -f compose.cloud.yaml up -d --build
# 私有连接信息写入 .env.cloud（参考 .env.cloud.example，已被 .gitignore 排除）。
# 本栈 minio、storage-init 移入 bundled-storage profile，默认不启动。
# 如需外部 PostgreSQL，在 .env.cloud 填写 CLOUD_DATABASE_URL 并使用 compose.cloud-db.yaml。

x-cloud-runtime: &cloud-runtime
  env_file:
    - path: ${MC_CLOUD_ENV_FILE:-.env.cloud}
      required: true
  environment:
    MC_EXTERNAL_SERVICES: '1'
    # R2 尚未完整支持 AWS SDK 默认的附加校验和；仅在接口要求时计算。
    AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
    AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

services:
  minio:
    profiles: ['bundled-storage']
  storage-init:
    profiles: ['bundled-storage']

  migrate:
    <<: *cloud-runtime

  api:
    <<: *cloud-runtime
    env_file:
      - path: ${MC_CLOUD_ENV_FILE:-.env.cloud}
        required: true
      - path: ${MC_ACCOUNT_ENV_FILE:-.env.newapi}
        required: false
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *cloud-runtime
