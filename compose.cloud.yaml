# 外部 PostgreSQL（如 Neon）与 S3 兼容存储（如 Cloudflare R2）叠加配置。
# 用法：docker compose --env-file .env.compose -f compose.yaml -f compose.cloud.yaml up -d --build
# 私有连接信息写入 .env.cloud（参考 .env.cloud.example，已被 .gitignore 排除）。
# 本栈 postgres、minio、storage-init 移入 bundled-storage profile，默认不启动；Redis 仍在本栈。

x-cloud-runtime: &cloud-runtime
  env_file:
    - path: ${MC_CLOUD_ENV_FILE:-.env.cloud}
      required: true
  environment:
    MC_EXTERNAL_SERVICES: '1'
    # R2 尚未完整支持 AWS SDK 默认的附加校验和；仅在接口要求时计算。
    AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
    AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

services:
  postgres:
    profiles: ['bundled-storage']
  minio:
    profiles: ['bundled-storage']
  storage-init:
    profiles: ['bundled-storage']

  migrate:
    <<: *cloud-runtime
    depends_on: !override
      initialize:
        condition: service_completed_successfully

  api:
    <<: *cloud-runtime
    env_file:
      - path: ${MC_CLOUD_ENV_FILE:-.env.cloud}
        required: true
      - path: ${MC_ACCOUNT_ENV_FILE:-.env.newapi}
        required: false
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *cloud-runtime
