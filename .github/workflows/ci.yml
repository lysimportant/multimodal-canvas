name: 持续集成检查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v4

      - name: 配置 pnpm
        id: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 配置 Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        id: install
        run: pnpm install --frozen-lockfile

      - name: 检查代码格式
        id: format
        run: pnpm format:check

      - name: 检查 TypeScript 类型
        id: typecheck
        run: pnpm typecheck

      - name: 运行测试
        id: test
        run: pnpm test

      - name: 构建项目
        id: build
        run: pnpm build

      - name: 生成中文检查摘要
        if: ${{ always() }}
        env:
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          PNPM_STATUS: ${{ steps.pnpm.outcome }}
          NODE_STATUS: ${{ steps.node.outcome }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          FORMAT_STATUS: ${{ steps.format.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          TEST_STATUS: ${{ steps.test.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        run: |
          status_text() {
            case "$1" in
              success) echo "通过" ;;
              failure) echo "失败" ;;
              skipped) echo "跳过" ;;
              cancelled) echo "已取消" ;;
              *) echo "未执行" ;;
            esac
          }

          {
            echo "## 持续集成检查摘要"
            echo ""
            echo "- 提交：\`$GITHUB_SHA\`"
            echo "- 分支：\`$GITHUB_REF_NAME\`"
            echo ""
            echo "| 检查项 | 状态 |"
            echo "| --- | --- |"
            echo "| 检出代码 | $(status_text "$CHECKOUT_STATUS") |"
            echo "| 配置 pnpm | $(status_text "$PNPM_STATUS") |"
            echo "| 配置 Node.js | $(status_text "$NODE_STATUS") |"
            echo "| 安装依赖 | $(status_text "$INSTALL_STATUS") |"
            echo "| 代码格式 | $(status_text "$FORMAT_STATUS") |"
            echo "| TypeScript 类型 | $(status_text "$TYPECHECK_STATUS") |"
            echo "| 测试 | $(status_text "$TEST_STATUS") |"
            echo "| 构建 | $(status_text "$BUILD_STATUS") |"
          } >> "$GITHUB_STEP_SUMMARY"
