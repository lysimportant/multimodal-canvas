name: 持续集成检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      r2_integration:
        description: 使用专用测试 R2 bucket 执行真实存储集成（会写入并清理测试对象）
        type: boolean
        default: false

jobs:
  validate:
    name: 代码与部署配置
    runs-on: ubuntu-latest
    env:
      WORKER_PROVIDER: mock
      RUN_SERVICE: memory
      VITE_API_BASE_URL: http://localhost:3000
      WEB_PORT: '5173'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - name: 安装锁定依赖并生成 Prisma Client
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
      - name: 安装媒体工具
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg openssl
      - name: 格式与 lint
        run: |
          pnpm format:check
          pnpm lint
      - name: 构建与类型检查
        run: |
          pnpm build
          pnpm typecheck
      - name: 单元与运行产物测试
        run: |
          pnpm test:runtime
          pnpm exec turbo run test --force --concurrency=1 --continue=dependencies-successful -- --maxWorkers=1 --minWorkers=1
      - name: R2 必选、Neon 可选、密钥持久化和代理日志回归
        run: node --test scripts/docker/*.test.mjs
      - name: 开发设施配置检查（仅使用合成密码）
        env:
          COMPOSE_DISABLE_ENV_FILE: '1'
          POSTGRES_PASSWORD: synthetic-ci-postgres
          REDIS_PASSWORD: synthetic-ci-redis
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Redis 跨进程限流
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
          TEST_REDIS_NAMESPACE: ci-rate-limit-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pnpm --filter @multimodal-canvas/api exec vitest run
          --config vitest.rate-limit-integration.config.ts --maxWorkers=1 --minWorkers=1
      - name: 未执行的外部验收说明
        if: ${{ always() }}
        run: |
          echo '常规 CI 不使用真实 R2 或 New API；不能视为登录、供应商生成或生产验收。' >> "$GITHUB_STEP_SUMMARY"

  r2_integration:
    name: 显式 R2 集成验收
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r2_integration }}
    runs-on: ubuntu-latest
    env:
      WORKER_PROVIDER: mock
      RUN_SERVICE: memory
      VITE_API_BASE_URL: http://localhost:3000
      WEB_PORT: '5173'
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/multimodal_canvas_ci?schema=public
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_NAMESPACE: canvas-r2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_S3_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
      TEST_S3_BUCKET: ${{ secrets.TEST_R2_BUCKET }}
      TEST_S3_ACCESS_KEY: ${{ secrets.TEST_R2_ACCESS_KEY }}
      TEST_S3_SECRET_KEY: ${{ secrets.TEST_R2_SECRET_KEY }}
      TEST_S3_REGION: auto
      TEST_S3_PREFIX: integration/ci/${{ github.run_id }}/${{ github.run_attempt }}
      TEST_S3_CONFIRMED_ISOLATED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      REQUIRE_INTEGRATION_SERVICES: 'true'
      REQUIRE_PRODUCTION_ENTRY: 'true'
      MEDIA_REAL_TESTS: 'true'
      MEDIA_OPS_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multimodal_canvas_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_user -d multimodal_canvas_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - name: 确认专用 R2 测试配置
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['TEST_S3_ENDPOINT', 'TEST_S3_BUCKET', 'TEST_S3_ACCESS_KEY', 'TEST_S3_SECRET_KEY']) {
            if (!process.env[name]?.trim()) throw new Error(`缺少 ${name}，未运行外部验收。`);
          }
          const endpoint = new URL(process.env.TEST_S3_ENDPOINT);
          if (endpoint.protocol !== 'https:' || !endpoint.hostname.endsWith('.r2.cloudflarestorage.com')) {
            throw new Error('测试对象存储必须为 Cloudflare R2。');
          }
          NODE
      - name: 安装、生成与构建
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm build
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg openssl
      - name: 验证 Prisma 并确认历史迁移已应用
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:validate
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate status
      - name: 数据、队列与真实 R2 集成
        run: >-
          pnpm --filter @multimodal-canvas/api test:integration --maxWorkers=1 --minWorkers=1
          --reporter=default --reporter=json --outputFile=../../test-results/ci/integration.json
      - name: 生产模式 TLS 代理与真实媒体归档
        run: >-
          pnpm --filter @multimodal-canvas/api exec vitest run
          src/production-proxy.test.ts src/media.real.test.ts src/media-ops.integration.test.ts
          --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json
          --outputFile=../../test-results/ci/media-entry.json
      - name: 确认无跳过并保存验收范围
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const name of ['integration', 'media-entry']) {
            const report = JSON.parse(readFileSync(`test-results/ci/${name}.json`, 'utf8'));
            assert.equal(report.success, true);
            assert.ok(report.numTotalTests > 0);
            assert.equal(report.numPendingTests, 0);
            assert.equal(report.numTodoTests ?? 0, 0);
            assert.equal(report.numPassedTests, report.numTotalTests);
          }
          NODE
          echo '本轮执行专用 R2 集成；未执行真实 New API 登录、模型生成或生产部署。' >> "$GITHUB_STEP_SUMMARY"
      - name: 保存 R2 验收报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci/*.json
          if-no-files-found: warn
          retention-days: 7
